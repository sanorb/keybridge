<!doctype html>
<!--
  KeyBridge web page
  ==================
  When you change this file:
    1. Bump APP_VERSION in the script section below (shown at the bottom of the page).
    2. Add an entry at the top of this list.

  Version history
  ---------------
  1.3.1  2026-11-01  Added version history and on-page version number.
  1.3.0  2026-10-31  Redesign: "Send clipboard" button, single "Type here" box with
                     Send, "Open IT Glue" button. Removed username/password fields.
                     "Press Enter after" now defaults to off.
  1.2.0  2026-10-31  Fix "unknown GATT error" on send: data chunks shrink and retry
                     automatically if KeyBridge rejects a write.
  1.1.0  2026-10-31  Status messages visible while connecting; added Connection log;
                     clearer pairing prompt; clean retry after a failed connect.
  1.0.0  2026-10-31  First version: Web Bluetooth connect with PIN pairing,
                     username/password fields, Enter option, speed setting, Stop.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="robots" content="noindex">
<title>KeyBridge</title>
<style>
  :root{
    --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --text:#e8eaf0; --muted:#8b93a7;
    --accent:#3ddc97; --accent-ink:#06210f; --blue:#5aa9ff; --warn:#ffb547; --bad:#ff6b6b;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f5f8; --card:#fff; --line:#dcdfe6; --text:#14161c; --muted:#5d6577;
           --accent:#12a86b; --accent-ink:#fff; --blue:#1f6fd1; --warn:#b26b00; --bad:#c62828; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       -webkit-tap-highlight-color:transparent}
  main{max-width:460px;margin:0 auto;padding:20px 16px 40px}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  h1{font-size:20px;margin:0;letter-spacing:.2px}
  .pill{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .pill.on{color:var(--accent);border-color:var(--accent)}
  .pill.busy{color:var(--warn);border-color:var(--warn)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  textarea,select{
    width:100%;padding:13px 12px;font-size:17px;border-radius:10px;border:1px solid var(--line);
    background:var(--bg);color:var(--text)}
  textarea{min-height:110px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  select{font-family:inherit;font-size:16px}
  button,.btn{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--card);
         color:var(--text);padding:14px;cursor:pointer;display:block;width:100%;text-align:center;text-decoration:none}
  button:active,.btn:active{transform:scale(.98)}
  button:disabled{opacity:.45}
  .primary{background:var(--accent);color:var(--accent-ink);border:0;font-weight:650;font-size:17px;padding:16px}
  .clip{border:2px solid var(--accent);color:var(--accent);font-weight:650;font-size:17px;padding:16px}
  .itg{border-color:var(--blue);color:var(--blue);font-weight:600}
  .gap{height:10px}
  .divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:16px 0}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
  .row{display:flex;gap:10px;align-items:center;margin:12px 0 0}
  .row label{color:var(--text);font-size:15px;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .row input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
  .row select{flex:1}
  #warn{color:var(--warn);font-size:14px;margin:8px 0 0}
  #status{text-align:center;color:var(--muted);font-size:15px;min-height:22px;margin:12px 0 0}
  #status.ok{color:var(--accent)} #status.bad{color:var(--bad)}
  .stop{margin-top:10px;border-color:var(--bad);color:var(--bad)}
  .note{font-size:13px;color:var(--muted);text-align:center}
  .unsupported{border-color:var(--warn)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header>
    <h1>KeyBridge</h1>
    <span id="conn" class="pill">Disconnected</span>
  </header>

  <div id="unsupported" class="card unsupported" hidden>
    <strong>Web Bluetooth isn't available in this browser.</strong>
    <p class="note" style="text-align:left">Android: open this page in Chrome.<br>
    iPhone: open this page in the Bluefy browser (App Store).<br>
    The page must be loaded over https.</p>
  </div>

  <button id="connectBtn" class="primary">Connect to KeyBridge</button>

  <div id="panel" hidden style="margin-top:14px">
    <div class="card">
      <button id="clipBtn" class="clip" type="button">Send clipboard</button>

      <div class="divider">or</div>

      <textarea id="text" placeholder="Type here" autocomplete="off" autocapitalize="off"
                autocorrect="off" spellcheck="false"></textarea>
      <div id="warn"></div>
      <div class="gap"></div>
      <button id="sendBtn" class="primary" type="button">Send</button>

      <div class="row">
        <label><input id="enter" type="checkbox"> Press Enter after</label>
      </div>
      <div class="row">
        <label for="speed">Speed</label>
        <select id="speed">
          <option value="4">Fast</option>
          <option value="10" selected>Normal</option>
          <option value="30">Slow — BIOS / KVM / iDRAC / iLO</option>
        </select>
      </div>

      <button id="stopBtn" class="stop" type="button" hidden>Stop typing</button>
    </div>
  </div>

  <p id="status"></p>

  <div class="gap"></div>
  <a class="btn itg" href="https://app.itglue.com" target="_blank" rel="noopener">Open IT Glue</a>

  <p class="note" style="margin-top:16px">Click into the target field on the computer first, then send.</p>

  <details style="margin-top:18px">
    <summary class="note" style="text-align:left;cursor:pointer">Connection log</summary>
    <pre id="log" style="white-space:pre-wrap;font-size:12px;color:var(--muted);margin:8px 0 0"></pre>
  </details>

  <p id="version" class="note" style="margin-top:18px;opacity:.7"></p>
</main>

<script>
(() => {
  // Bump this on every change and add a line to the version history at the top of the file.
  const APP_VERSION = '1.3.1';

  // Must match KeyBridge.ino
  const SERVICE = '7b1a0001-5c3e-4d2a-9f4e-2b6c8d0e1f01';
  const CMD     = '7b1a0002-5c3e-4d2a-9f4e-2b6c8d0e1f01';
  const STATUS  = '7b1a0003-5c3e-4d2a-9f4e-2b6c8d0e1f01';
  const OP = { BEGIN: 1, DATA: 2, COMMIT: 3, CANCEL: 4 };
  const CHUNK = 19;            // 20-byte default BLE payload minus 1 opcode byte
  const MAX_LEN = 2048;

  const $ = id => document.getElementById(id);
  let device = null, cmdChar = null, statusChar = null, sending = false;
  let chunkSize = CHUNK;       // shrinks automatically if KeyBridge rejects large writes

  $('version').textContent = 'KeyBridge page v' + APP_VERSION;

  if (!navigator.bluetooth) {
    $('unsupported').hidden = false;
    $('connectBtn').disabled = true;
  }

  function setConn(text, cls) { const p = $('conn'); p.textContent = text; p.className = 'pill ' + (cls || ''); }
  function setStatus(text, cls) { const s = $('status'); s.textContent = text; s.className = cls || ''; }
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  const t0 = Date.now();
  function log(msg) {
    const line = `[${((Date.now() - t0) / 1000).toFixed(1)}s] ${msg}`;
    $('log').textContent += line + '\n';
    console.log(line);
  }
  log(`page v${APP_VERSION}`);

  async function write(bytes) {
    await cmdChar.writeValueWithResponse(new Uint8Array(bytes));
  }

  // ---------- connection & pairing ----------

  // First encrypted write triggers the OS pairing prompt (PIN). Retry while the tech enters it.
  async function ensurePaired() {
    const deadline = Date.now() + 60000;
    let attempt = 0;
    while (true) {
      attempt++;
      log(`secure write attempt ${attempt}…`);
      try { await write([OP.CANCEL]); log('secure write OK — paired'); return; }
      catch (e) {
        log(`secure write failed: ${e.name}: ${e.message}`);
        if (!device.gatt.connected) throw new Error('KeyBridge dropped the connection during pairing');
        if (Date.now() > deadline) throw new Error('Pairing timed out');
        setStatus('Enter the KeyBridge PIN if asked — check your notification shade for a pairing request.');
        await sleep(1500);
      }
    }
  }

  async function connect() {
    try {
      if (!device) {
        log('opening device picker');
        device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE] }] });
        device.addEventListener('gattserverdisconnected', onDisconnected);
        log(`picked: ${device.name || '(no name)'}`);
      }
      setConn('Connecting…', 'busy');
      setStatus('Connecting…');
      $('connectBtn').disabled = true;

      log('gatt.connect…');
      const server = await device.gatt.connect();
      log('connected; getting service…');
      const svc = await server.getPrimaryService(SERVICE);
      log('service OK; getting characteristics…');
      cmdChar = await svc.getCharacteristic(CMD);
      statusChar = await svc.getCharacteristic(STATUS);
      log('characteristics OK; pairing…');

      await ensurePaired();

      try {
        await statusChar.startNotifications();
        statusChar.addEventListener('characteristicvaluechanged', onStatus);
        log('status notifications on');
      } catch (e) { log(`notifications unavailable: ${e.message}`); }

      setConn('Connected', 'on');
      setStatus('Ready.');
      $('connectBtn').hidden = true;
      $('panel').hidden = false;
    } catch (e) {
      log(`connect failed: ${e.name}: ${e.message}`);
      setConn('Disconnected');
      if (e.name === 'NotFoundError') setStatus('');
      else setStatus((e.message || 'Could not connect') + ' — tap Connect to try again.', 'bad');
      try { if (device && device.gatt.connected) device.gatt.disconnect(); } catch (_) {}
      device = null;   // next tap reopens the picker for a clean start
      $('connectBtn').disabled = false;
      $('connectBtn').textContent = 'Connect to KeyBridge';
    }
  }

  function onDisconnected() {
    log('disconnected');
    setConn('Disconnected');
    $('panel').hidden = true;
    $('connectBtn').hidden = false;
    $('connectBtn').disabled = false;
    $('connectBtn').textContent = 'Reconnect';
    $('stopBtn').hidden = true;
    sending = false;
    setButtons(true);
  }

  function onStatus(ev) {
    const msg = new TextDecoder().decode(ev.target.value);
    if (msg === 'TYPING')         { setStatus('Typing…'); $('stopBtn').hidden = false; }
    else if (msg === 'DONE')      { setStatus('Typed ✓', 'ok'); $('stopBtn').hidden = true; }
    else if (msg === 'CANCELLED') { setStatus('Stopped.', 'bad'); $('stopBtn').hidden = true; }
    else if (msg === 'BUSY')      { setStatus('Still typing the last one — wait or stop it.', 'bad'); }
    else if (msg.startsWith('ERR:')) { setStatus('Error: ' + msg.slice(4), 'bad'); $('stopBtn').hidden = true; }
  }

  // ---------- sending ----------

  const isTypeable = c => c === '\t' || c === '\n' || (c >= ' ' && c <= '~');

  function setButtons(enabled) {
    $('sendBtn').disabled = !enabled;
    $('clipBtn').disabled = !enabled;
  }

  // Sends text to KeyBridge. Returns true on success.
  async function sendText(raw) {
    if (sending || !cmdChar) return false;

    let payload = raw.replace(/\r\n?/g, '\n');
    if ($('enter').checked) payload += '\n';
    const skipped = [...new Set([...payload].filter(c => !isTypeable(c)))];
    payload = [...payload].filter(isTypeable).join('');

    if (!payload) { setStatus('Nothing to type.', 'bad'); return false; }
    if (payload.length > MAX_LEN) { setStatus(`Too long (${MAX_LEN} max).`, 'bad'); return false; }

    const bytes = new TextEncoder().encode(payload);   // ASCII only, so 1 byte per char
    const speed = parseInt($('speed').value, 10);

    sending = true; setButtons(false);
    setStatus('Sending…');
    try {
      log(`send: ${bytes.length} chars, chunk size ${chunkSize}`);
      await write([OP.BEGIN]);
      let i = 0;
      while (i < bytes.length) {
        const piece = bytes.subarray(i, i + chunkSize);
        try {
          await write([OP.DATA, ...piece]);
          i += piece.length;
        } catch (e) {
          log(`DATA write of ${piece.length + 1} bytes failed: ${e.name}: ${e.message}`);
          if (!device || !device.gatt.connected) throw new Error('KeyBridge disconnected');
          if (chunkSize === 1) throw e;
          chunkSize = Math.max(1, Math.floor(chunkSize / 2));
          log(`retrying with chunk size ${chunkSize}`);
          await sleep(200);
        }
      }
      await write([OP.COMMIT, speed]);
      log('sent OK');
      bytes.fill(0);
      if ($('status').textContent === 'Sending…') setStatus('Sent.', 'ok');
      $('warn').textContent = skipped.length
        ? 'Skipped characters that can\'t be typed: ' + skipped.map(c => JSON.stringify(c)).join(' ')
        : '';
      return true;
    } catch (e) {
      log(`send failed: ${e.name}: ${e.message}`);
      setStatus('Send failed: ' + (e.message || e) + ' — open Connection log for details.', 'bad');
      return false;
    } finally {
      sending = false; setButtons(true);
    }
  }

  async function sendTyped() {
    const ok = await sendText($('text').value);
    if (ok) $('text').value = '';
  }

  async function sendClipboard() {
    let t;
    try {
      t = await navigator.clipboard.readText();
    } catch (e) {
      setStatus('Clipboard access blocked — allow it for this site in Chrome, or paste into the box instead.', 'bad');
      return;
    }
    t = t.replace(/[\r\n]+$/, '');   // drop trailing newline that some apps add when copying
    if (!t) { setStatus('Clipboard is empty.', 'bad'); return; }
    await sendText(t);
    t = '';
  }

  async function stop() {
    try { await write([OP.CANCEL]); } catch (e) {}
  }

  $('connectBtn').addEventListener('click', connect);
  $('clipBtn').addEventListener('click', sendClipboard);
  $('sendBtn').addEventListener('click', sendTyped);
  $('stopBtn').addEventListener('click', stop);
})();
</script>
</body>
</html>
